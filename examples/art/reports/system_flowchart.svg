<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="920" viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
    
    <!-- Clean Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #FFFFFF; }
    .node-start { fill: #F0F6FF; stroke: #2563EB; stroke-width: 1.8; filter: url(#shadow); }
    .node-process { fill: #FFFFFF; stroke: #334155; stroke-width: 1.6; filter: url(#shadow); }
    .node-decision { fill: #FFFFFF; stroke: #334155; stroke-width: 1.6; filter: url(#shadow); }
    
    .text-main { font-family: "Microsoft YaHei", "PingFang SC", "SimSun", "STHeiti", sans-serif; font-size: 14px; fill: #0F172A; text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
    .text-title { font-family: "Microsoft YaHei", "PingFang SC", "SimSun", "STHeiti", sans-serif; font-size: 14px; fill: #1D4ED8; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
    .text-label { font-family: "Arial", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
    
    .line { stroke: #334155; stroke-width: 1.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .arrow-line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- 1. 系统启动 -->
  <rect x="230" y="25" width="180" height="42" rx="21" class="node-start"/>
  <text x="320" y="46" class="text-title">系统启动</text>

  <path d="M 320 67 L 320 93" class="arrow-line"/>

  <!-- 2. 驱动程序配置、初始化 -->
  <rect x="180" y="95" width="280" height="46" rx="4" class="node-process"/>
  <text x="320" y="118" class="text-main">驱动程序配置、初始化</text>

  <path d="M 320 141 L 320 167" class="arrow-line"/>

  <!-- 3. 采样 -->
  <rect x="210" y="169" width="220" height="46" rx="4" class="node-process"/>
  <text x="320" y="192" class="text-main">采样</text>

  <!-- Split to two buffer decisions -->
  <path d="M 320 215 L 320 235 L 210 235 L 210 248" class="arrow-line"/>
  <path d="M 320 235 L 430 235 L 430 248" class="arrow-line"/>

  <!-- 4a. 数据缓冲区1已存满 -->
  <polygon points="210,250 280,285 210,320 140,285" class="node-decision"/>
  <text x="210" y="278" class="text-main">数据缓冲区1</text>
  <text x="210" y="296" class="text-main">已存满</text>

  <!-- 4b. 数据缓冲区2已存满 -->
  <polygon points="430,250 500,285 430,320 360,285" class="node-decision"/>
  <text x="430" y="278" class="text-main">数据缓冲区2</text>
  <text x="430" y="296" class="text-main">已存满</text>

  <!-- Y connections merging to 同步信号检测 -->
  <path d="M 210 320 L 210 342 L 320 342" class="line"/>
  <path d="M 430 320 L 430 342 L 320 342" class="line"/>
  <path d="M 320 342 L 320 372" class="arrow-line"/>

  <text x="225" y="331" class="text-label">Y</text>
  <text x="415" y="331" class="text-label">Y</text>

  <!-- 5. 同步信号检测 -->
  <rect x="210" y="374" width="220" height="46" rx="4" class="node-process"/>
  <text x="320" y="397" class="text-main">同步信号检测</text>

  <path d="M 320 420 L 320 448" class="arrow-line"/>

  <!-- 6. 信号已到达 -->
  <polygon points="320,450 410,485 320,520 230,485" class="node-decision"/>
  <text x="320" y="485" class="text-main">信号已到达</text>

  <path d="M 320 520 L 320 553" class="arrow-line"/>
  <text x="332" y="534" class="text-label">Y</text>

  <path d="M 230 485 L 145 485" class="arrow-line"/>
  <text x="187" y="475" class="text-label">N</text>

  <!-- 7. 通信信号解码 -->
  <rect x="210" y="555" width="220" height="46" rx="4" class="node-process"/>
  <text x="320" y="578" class="text-main">通信信号解码</text>

  <path d="M 320 601 L 320 629" class="arrow-line"/>

  <!-- 8. 收到释放指令 -->
  <polygon points="320,631 410,666 320,701 230,666" class="node-decision"/>
  <text x="320" y="666" class="text-main">收到释放指令</text>

  <path d="M 320 701 L 320 734" class="arrow-line"/>
  <text x="332" y="715" class="text-label">Y</text>

  <path d="M 230 666 L 155 666" class="arrow-line"/>
  <text x="192" y="656" class="text-label">N</text>

  <!-- 9. 释放锚系设备 -->
  <rect x="210" y="736" width="220" height="46" rx="4" class="node-process"/>
  <text x="320" y="759" class="text-main">释放锚系设备</text>

  <path d="M 320 782 L 320 808" class="arrow-line"/>

  <!-- 10. 回收仪器 -->
  <rect x="230" y="810" width="180" height="42" rx="21" class="node-start"/>
  <text x="320" y="831" class="text-title">回收仪器</text>

  <!-- Left loop branch nodes -->
  <!-- 执行指令发送应答 -->
  <rect x="25" y="643" width="130" height="46" rx="4" class="node-process"/>
  <text x="90" y="657" class="text-main">执行指令</text>
  <text x="90" y="675" class="text-main">发送应答</text>

  <path d="M 90 643 L 90 508" class="arrow-line"/>

  <!-- 待机 -->
  <rect x="35" y="462" width="110" height="46" rx="4" class="node-process"/>
  <text x="90" y="485" class="text-main">待机</text>

  <!-- Loop back from 待机 to 采样 -->
  <path d="M 90 462 L 90 192 L 208 192" class="arrow-line"/>

</svg>
